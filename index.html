<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="实时把输入的文字转换成 32×32 汉字点阵，按 10 列 18 行显示"
    />
    <title>汉字点阵排字板</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="input-panel">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true">字</span>
          <div>
            <p>HANZI MATRIX</p>
            <h1>汉字点阵排字板</h1>
          </div>
        </header>

        <section class="editor-section" aria-labelledby="editor-title">
          <div class="section-heading">
            <div>
              <span class="step-number">01</span>
              <h2 id="editor-title">输入文字</h2>
            </div>
            <span class="live-indicator">
              <i aria-hidden="true"></i>
              实时同步
            </span>
          </div>

          <label class="sr-only" for="character-input">要转换成点阵的文字</label>
          <textarea
            id="character-input"
            autofocus
            spellcheck="false"
            aria-describedby="input-help character-count"
          >我爱你</textarea>

          <div class="editor-footer">
            <span id="character-count" aria-live="polite">3 / 180 字</span>
            <button id="clear-button" type="button">清空</button>
          </div>
        </section>

        <div class="input-help" id="input-help">
          <span aria-hidden="true">↵</span>
          <p>
            连续输入会每 10 字自动换行；按回车可提前换到下一行。最多显示
            180 个汉字位。
          </p>
        </div>

        <footer class="input-footer">
          <span>32 × 32 / 字</span>
          <span>10 列 × 18 行</span>
        </footer>
      </aside>

      <main class="preview-panel">
        <header class="preview-header">
          <div>
            <span class="step-number">02</span>
            <h2>点阵预览</h2>
          </div>
          <div class="spec-list" aria-label="画布规格">
            <span><b>32 × 32</b> 点阵</span>
            <span><b>10</b> 列</span>
            <span><b>18</b> 行</span>
          </div>
        </header>

        <div class="board-scroller">
          <section
            id="matrix-board"
            class="matrix-board"
            aria-label="10 列 18 行的汉字点阵画布"
          ></section>
        </div>
      </main>
    </div>

    <noscript>请启用 JavaScript 以实时生成汉字点阵。</noscript>
    <script src="app.js"></script>
  </body>
</html>
