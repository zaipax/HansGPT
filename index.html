<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="使用三个 32×32 点阵显示“我爱你”"
    />
    <title>32×32 汉字点阵 · 我爱你</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">32 × 32 CHINESE DOT MATRIX</p>
        <h1>我爱你</h1>
        <p class="intro">
          每个汉字由 32 × 32 个独立格子组成，三个字共 3,072 个格子。
        </p>
      </header>

      <section
        id="matrix-display"
        class="matrix-display"
        aria-label="我爱你三个字的 32 乘 32 点阵显示"
      ></section>

      <footer>
        <span class="legend-dot" aria-hidden="true"></span>
        点亮的格子组成汉字笔画
      </footer>
    </main>

    <noscript>请启用 JavaScript 以生成 32×32 汉字点阵。</noscript>
    <script src="app.js"></script>
  </body>
</html>
